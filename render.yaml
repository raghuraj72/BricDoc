services:
  # ============================================================================
  # BRICDOC ALL-IN-ONE BACKEND & IN-PROCESS WORKER (FREE TIER)
  # Zero-cost hosting on Render Free Web Service with external serverless Postgres
  # ============================================================================
  - type: web
    name: bricdoc-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 10000
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://bricdoc-raghuraj.vercel.app,https://bricdoc.in,https://bricdoc.vercel.app
      - key: APP_URL
        value: https://bricdoc-raghuraj.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        value: ""
      - key: STORAGE_DIR
        value: /tmp/vault_storage
      - key: MAX_UPLOAD_SIZE_MB
        value: "25"
      - key: MAX_CONCURRENT_JOBS
        value: "1"
      - key: ENABLE_INPROCESS_WORKER
        value: "true"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_MODE
        value: test
