services:
  - type: web
    name: bricdoc-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /health
    disk:
      name: bricdoc-vault
      mountPath: /app/vault_storage
      sizeGB: 10
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://bricdoc-raghuraj.vercel.app,https://bricdoc.in,https://bricdoc.vercel.app
      - key: APP_URL
        value: https://bricdoc-raghuraj.vercel.app
      - key: GEMINI_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
